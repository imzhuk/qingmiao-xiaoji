<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>青苗小记</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="room">
  <header class="book-header">
    <span></span><h1>青苗小记</h1><span id="orientation">打开跨页</span>
  </header>
  <section class="stage" aria-label="Interactive photo book">
    <div class="book-rig">
      <div id="book" class="book" data-page-width="512" data-page-height="640">
        <article class="book-page art-page cloth recto" data-density="hard" aria-label="封面">
          <h2 class="cover-title">青苗小记</h2><p class="cover-subtitle">二〇二六 八月</p>
        </article>
        <article class="book-page art-page endpaper verso" aria-label="Page 1"></article>
        <article class="book-page art-page paper recto" aria-label="Page 2">
          <p class="epigraph">把日子画下来，就不怕忘。</p>
        </article>
        <article class="book-page art-page paper verso" aria-label="Page 3">
          <div class="chapter-block"><p class="chapter-no">第一章</p><h2>合照</h2><p>三个人，一张合影，画了三次。脸上的彩绘还没洗掉，头发被揉得一团乱，谁都在笑。</p></div>
        </article>
        <article class="book-page art-page paper recto" aria-label="Page 4">
          <figure class="plate large has-caption"><img src="assets/photos/hezhao1.png" alt="三个小孩的扁平风插画：绿龙、蓝鲸和小恐龙彩绘"><figcaption class="plate-caption">合照 · 吉卜力</figcaption></figure>
        </article>
        <article class="book-page art-page paper verso" aria-label="Page 5">
          <figure class="plate large has-caption"><img src="assets/photos/hezhao2.png" alt="同一张合照的蜡笔涂鸦版，线条奔放颜色浓烈"><figcaption class="plate-caption">合照 · 蜡笔版</figcaption></figure>
        </article>
        <article class="book-page art-page paper recto" aria-label="Page 6">
          <figure class="plate large has-caption"><img src="assets/photos/hezhao3.jpg" alt="同一张合照的立体渲染版，三个人物更写实"><figcaption class="plate-caption">合照 · 皮克斯</figcaption></figure>
        </article>
        <article class="book-page art-page paper verso" aria-label="Page 7">
          <div class="chapter-block"><p class="chapter-no">第二章</p><h2>蓝花楹</h2><p>一个恐龙外壳，一个外星人合照，还有实在找不到照片随便放的蓝花楹。</p></div>
        </article>
        <article class="book-page art-page paper recto" aria-label="Page 8">
          <figure class="plate portrait has-caption"><img src="assets/photos/lanhua1.png" alt="穿机器人纸箱装备的小孩，头顶挂着彩灯，旁边是书架"><figcaption class="plate-caption">挤不下的恐龙外壳</figcaption></figure>
        </article>
        <article class="book-page art-page paper verso" aria-label="Page 9">
          <figure class="plate large has-caption"><img src="assets/photos/lanhua2.jpg" alt="穿粉色 GAP 连帽衫的人站在木门边"><figcaption class="plate-caption">凑数照片</figcaption></figure>
        </article>
        <article class="book-page art-page paper recto" aria-label="Page 10">
          <figure class="plate large has-caption"><img src="assets/photos/lanhua3.jpg" alt="砖墙前，一个涂满彩虹颜色的人偶旁边，黑衣小孩在比耶"><figcaption class="plate-caption">与外星人合照</figcaption></figure>
        </article>
        <article class="book-page art-page paper verso" aria-label="Page 11">
          <figure class="plate medium has-caption"><img src="assets/photos/xiaohuahua.jpg" alt="一幅小孩画：红色双马尾、粉色裙子、头戴小兔子发卡的女孩"><figcaption class="plate-caption">一个爱吃蛋糕的小朋友画的</figcaption></figure>
        </article>
        <article class="book-page art-page paper recto" aria-label="Page 12">
          <div class="chapter-block"><p class="chapter-no">第三章</p><h2>张起灵</h2><p>照顾人，薯片鸭子，抢小朋友木马的张起灵，一包纸，还有一本《只有春天和爱允许入内》。</p></div>
        </article>
        <article class="book-page art-page paper verso" aria-label="Page 13">
          <figure class="plate portrait has-caption"><img src="assets/photos/zql1.png" alt="坐在扶手椅上的女孩举着手机比耶"><figcaption class="plate-caption">不爱唱歌爱照顾人</figcaption></figure>
        </article>
        <article class="book-page art-page paper recto" aria-label="Page 14">
          <figure class="plate portrait has-caption"><img src="assets/photos/zql2.png" alt="吹着黄色泡泡糖的女孩敬礼，脸上画着彩色小花"><figcaption class="plate-caption">恐龙谷的薯片鸭子</figcaption></figure>
        </article>
        <article class="book-page art-page paper verso" aria-label="Page 15">
          <figure class="plate portrait has-caption"><img src="assets/photos/zql3.png" alt="女孩坐在黄色小鸭弹簧摇摇乐上挥手"><figcaption class="plate-caption">抢小朋友的木马</figcaption></figure>
        </article>
        <article class="book-page art-page paper recto" aria-label="Page 16">
          <figure class="plate large has-caption"><img src="assets/photos/zql-paper.jpg" alt="一张纸上的涂鸦：蓝色波浪、黄色小星星和一只露出纸角的盒子"><figcaption class="plate-caption">吃起来甜甜的纸</figcaption></figure>
        </article>
        <article class="book-page art-page paper verso" aria-label="Page 17">
          <figure class="plate large has-caption"><img src="assets/photos/zql-gift.png" alt="手绘书封《只有春天和爱允许入内》，紫色封面，黄沙发上一只绿猫"><figcaption class="plate-caption">《只有春天和爱允许入内》</figcaption></figure>
        </article>
        <article class="book-page art-page paper recto" aria-label="Page 18">
          <div class="chapter-block"><p class="chapter-no">第四章</p><h2>章章</h2><p>蓝色角龙，卡点过生日，在亭子下傻笑的章章。</p></div>
        </article>
        <article class="book-page art-page paper verso" aria-label="Page 19">
          <figure class="plate portrait has-caption"><img src="assets/photos/zz1.png" alt="眼角画着蓝色花朵彩绘的女孩在太阳下挥手"><figcaption class="plate-caption">蓝色角龙</figcaption></figure>
        </article>
        <article class="book-page art-page paper recto" aria-label="Page 20">
          <figure class="plate portrait has-caption"><img src="assets/photos/zz2.png" alt="戴眼镜的人捧着插有一支蜡烛的巧克力蛋糕"><figcaption class="plate-caption">蜡烛先点，愿望后说</figcaption></figure>
        </article>
        <article class="book-page art-page paper verso" aria-label="Page 21">
          <figure class="plate portrait has-caption"><img src="assets/photos/zz3.png" alt="生日餐桌前，戴眼镜的人举着 Hello Kitty 纸袋"><figcaption class="plate-caption">桌上的食物，怀里的礼物</figcaption></figure>
        </article>
        <article class="book-page art-page paper recto" aria-label="Page 22">
          <figure class="plate portrait has-caption"><img src="assets/photos/zz4.png" alt="亭子下长发的戴眼镜女孩回头大笑"><figcaption class="plate-caption">亭子下傻笑</figcaption></figure>
        </article>
        <article class="book-page art-page paper verso" aria-label="Page 23">
          <figure class="plate large has-caption"><img src="assets/photos/zz-gift.png" alt="蓝色夜色里的酒吧，七个人举着啤酒杯，落款 08.01.2026"><figcaption class="plate-caption">二〇二六年八月一日，开心</figcaption></figure>
        </article>
        <article class="book-page art-page paper recto" aria-label="Page 24">
          <div class="chapter-block"><p class="chapter-no">第五章</p><h2>乔治</h2><p>乔治的一天：晒太阳，喝饮料，打瞌睡。</p></div>
        </article>
        <article class="book-page art-page paper verso" aria-label="Page 25">
          <figure class="plate large has-caption"><img src="assets/photos/qiaozhi1.png" alt="阳光下鼓着腮帮子的人，背景是蓝天绿树"><figcaption class="plate-caption">依旧薯片鸭子</figcaption></figure>
        </article>
        <article class="book-page art-page paper recto" aria-label="Page 26">
          <figure class="plate large has-caption"><img src="assets/photos/qiaozhi2.png" alt="背红色双肩包的人插着吸管喝饮料，身后是街道与行人"><figcaption class="plate-caption">偷吃小朋友零食</figcaption></figure>
        </article>
        <article class="book-page art-page paper verso" aria-label="Page 27">
          <figure class="plate large has-caption"><img src="assets/photos/qiaozhi3.png" alt="一头黑发的人趴在手臂上睡着"><figcaption class="plate-caption">永远睡不醒</figcaption></figure>
        </article>
        <article class="book-page art-page paper recto" aria-label="Page 28">
          <div class="colophon"><p>青苗小记</p><p>一本全是画的相册<br>二〇二六 八月</p></div>
        </article>
        <article class="book-page art-page endpaper verso" aria-label="Page 29"></article>
        <article class="book-page art-page cloth recto" data-density="hard" aria-label="封底">
          <span class="back-mark">青苗小记</span>
        </article>
      </div>
    </div>
  </section>
  <footer class="controls" aria-label="Book controls">
    <button id="previous" type="button" aria-label="上一页">←</button>
    <div class="status" aria-live="polite"><span id="page-status">封面</span><small>拖动或用方向键翻页</small></div>
    <button id="next" type="button" aria-label="下一页">→</button>
  </footer>
</main>
<script src="vendor/page-flip.browser.js"></script>
<script src="flipbook.js"></script>
</body>
</html>
